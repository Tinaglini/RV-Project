spring.application.name=sistema-clientes-rv
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/clientes_rv_db
spring.datasource.username=root
spring.datasource.password=senha
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=8080
logging.level.app.sistemaclientesrv=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=true

# JWT Configuration
# Secret must be base64 encoded and at least 256 bits (32 bytes)
# Configure JWT_SECRET in .env file
jwt.secret=${JWT_SECRET}
# Token expiration in milliseconds (86400000 ms = 24 hours)
jwt.expiration=${JWT_EXPIRATION}